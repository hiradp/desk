[package]
name = "desk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Build and extend a terminal workspace inside a multiplexer"
license = "MIT"
repository = "https://github.com/hiradp/desk"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "1.1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.20"
